# SPDX-License-Identifier: AGPL-3.0-or-later
# Publish the browser-only build (engine + IndexedDB in the page) to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - run: npm ci
      - name: Build browser version
        run: sh scripts/build-pages.sh "$GITHUB_WORKSPACE/dist-pages"
        env:
          PAGES_BASE: /candledrill/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
