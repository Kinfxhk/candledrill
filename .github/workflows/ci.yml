# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + property + golden tests
        run: npm test

      - name: Dependency licence check (AGPL-3.0 compatible allowlist)
        run: npm run check:licenses

      - name: No bundled market data / required notices
        run: npm run check:no-market-data

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}"

      - name: Secret scan
        run: npm run check:secrets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Headless smoke test (replay + bracket order flow)
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build --pull -t candledrill:ci .

      - name: Run container and wait for health endpoint
        run: |
          set -euo pipefail
          docker run -d --name candledrill-ci -p 127.0.0.1:4870:4870 candledrill:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4870/api/health; then
              echo
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time." >&2
          docker logs candledrill-ci >&2
          exit 1

      - name: UI is served on loopback
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:4870/

      - name: Container logs
        if: always()
        run: docker logs candledrill-ci || true
